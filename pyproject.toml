[build-system]
requires = ["setuptools==82.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trade"
version = "1.0.0"
description = "Auditable local investment research, paper-trading, and broker-readiness workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Shiraikuroko123"}]
keywords = ["etf", "backtest", "paper-trading", "risk-management", "china-market"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
baostock = ["baostock==0.9.3"]
cloud = ["boto3>=1.35,<2"]
jqdata = ["jqdatasdk>=1.9.8,<2"]
dev = [
  "coverage[toml]==7.10.1",
  "mypy==1.17.1",
  "ruff==0.12.4",
]

[project.urls]
Homepage = "https://github.com/Shiraikuroko123/ai-trade"
Repository = "https://github.com/Shiraikuroko123/ai-trade"
Issues = "https://github.com/Shiraikuroko123/ai-trade/issues"

[project.scripts]
ai-trade = "ai_trade.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_trade = ["default_config.json", "default_security_master.json"]
"ai_trade.web.assets" = ["*.html", "*.css", "*.js", "vendor/*.js", "vendor/*.txt"]

[tool.coverage.run]
branch = true
source = ["ai_trade"]

[tool.coverage.report]
fail_under = 75
precision = 1
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = [
  "src/ai_trade/broker/shadow_ledger.py",
  "src/ai_trade/broker/shadow_projection.py",
  "src/ai_trade/broker/shadow_reconciliation.py",
  "src/ai_trade/broker/shadow_schema.py",
  "src/ai_trade/data/evidence_io.py",
  "src/ai_trade/data/jqdata.py",
  "src/ai_trade/security_store.py",
  "src/ai_trade/feature_store",
  "src/ai_trade/factor_lab",
  "src/ai_trade/model_lab",
  "src/ai_trade/pipeline_cli.py",
  "src/ai_trade/portfolio",
  "src/ai_trade/research_loop",
  "src/ai_trade/hypothesis_lab",
  "src/ai_trade/research_statistics.py",
]
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
